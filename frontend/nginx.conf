server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Manifest - no auth required (PWA manifest)
    location = /manifest.json {
        auth_basic off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;

        # HTTP Basic Auth — protects the app from unauthorized access.
        # Generate .htpasswd with: htpasswd -c frontend/.htpasswd admin
        # Then rebuild the Docker image.
        # Comment out these two lines to disable auth (e.g. for local dev).
        auth_basic "AI Pulse Pro";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }

    # No-cache for service workers and index.html so stale SW never blocks updates
    location ~* (service-worker\.js|sw\.js)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        expires 0;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires 0;
    }

    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Pipeline status - longer timeout for long-running operations
    location /api/pipeline/status {
        proxy_pass http://backend:5000/api/pipeline/status;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_connect_timeout 60s;
    }

    # SSE requires streaming responses; disable nginx buffering for this endpoint.
    location /api/pipeline/stream {
        proxy_pass http://backend:5000/api/pipeline/stream;
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check endpoint — no auth so Docker healthcheck works
    location /health {
        auth_basic off;
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
