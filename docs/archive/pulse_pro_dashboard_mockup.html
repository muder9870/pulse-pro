
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font-sans);}
  .app{display:flex;height:680px;background:var(--color-background-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;border:0.5px solid var(--color-border-tertiary);}

  /* SIDEBAR */
  .sidebar{width:220px;min-width:220px;background:var(--color-background-primary);border-right:0.5px solid var(--color-border-tertiary);display:flex;flex-direction:column;padding:0;}
  .sidebar-logo{padding:18px 16px 12px;border-bottom:0.5px solid var(--color-border-tertiary);}
  .sidebar-logo .logo-text{font-size:15px;font-weight:500;color:var(--color-text-primary);}
  .sidebar-logo .logo-sub{font-size:11px;color:var(--color-text-tertiary);margin-top:2px;}
  .nav-section-label{font-size:10px;color:var(--color-text-tertiary);letter-spacing:0.08em;text-transform:uppercase;padding:14px 16px 6px;}
  .nav-item{display:flex;align-items:center;gap:9px;padding:7px 16px;font-size:13px;color:var(--color-text-secondary);cursor:pointer;border-radius:0;transition:background 0.1s;}
  .nav-item:hover{background:var(--color-background-secondary);}
  .nav-item.active{background:var(--color-background-secondary);color:var(--color-text-primary);font-weight:500;}
  .nav-item .icon{width:15px;height:15px;opacity:0.7;flex-shrink:0;}
  .nav-item.active .icon{opacity:1;}
  .nav-badge{margin-left:auto;background:var(--color-background-info);color:var(--color-text-info);font-size:10px;padding:1px 6px;border-radius:10px;font-weight:500;}
  .nav-badge.stub{background:var(--color-background-warning);color:var(--color-text-warning);}
  .sidebar-footer{margin-top:auto;padding:12px 16px;border-top:0.5px solid var(--color-border-tertiary);}
  .sidebar-footer .version{font-size:11px;color:var(--color-text-tertiary);}
  .sidebar-footer .plan{font-size:12px;font-weight:500;color:var(--color-text-primary);}

  /* MAIN */
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
  .topbar{padding:12px 20px;border-bottom:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary);display:flex;align-items:center;gap:12px;}
  .topbar-title{font-size:15px;font-weight:500;color:var(--color-text-primary);}
  .topbar-sub{font-size:12px;color:var(--color-text-tertiary);margin-left:4px;}
  .topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
  .btn{font-size:12px;padding:5px 12px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:transparent;color:var(--color-text-primary);cursor:pointer;}
  .btn-primary{background:var(--color-text-primary);color:var(--color-background-primary);border-color:var(--color-text-primary);}
  .btn-primary.running{background:var(--color-background-warning);color:var(--color-text-warning);border-color:var(--color-border-warning);}

  .content{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px;}

  /* PIPELINE STATUS */
  .pipeline-bar{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:10px 14px;display:flex;align-items:center;gap:10px;}
  .pipeline-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .pipeline-dot.idle{background:#888;}
  .pipeline-dot.running{background:#d97706;animation:pulse 1.2s infinite;}
  .pipeline-dot.success{background:#16a34a;}
  .pipeline-dot.failed{background:#dc2626;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
  .pipeline-text{font-size:12px;color:var(--color-text-secondary);}
  .pipeline-text strong{color:var(--color-text-primary);font-weight:500;}
  .pipeline-stage{margin-left:auto;font-size:11px;color:var(--color-text-tertiary);}

  /* STATS ROW */
  .stats-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;}
  .stat-card{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:12px 14px;}
  .stat-label{font-size:11px;color:var(--color-text-tertiary);margin-bottom:4px;}
  .stat-value{font-size:22px;font-weight:500;color:var(--color-text-primary);}
  .stat-delta{font-size:11px;margin-top:2px;}
  .delta-up{color:var(--color-text-success);}
  .delta-down{color:var(--color-text-danger);}

  /* DAILY INTEL */
  .section-header{font-size:12px;font-weight:500;color:var(--color-text-secondary);letter-spacing:0.04em;text-transform:uppercase;margin-bottom:8px;}
  .intel-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:12px 14px;border-left:3px solid #7f77dd;}
  .intel-title{font-size:13px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px;}
  .intel-body{font-size:12px;color:var(--color-text-secondary);line-height:1.6;}

  /* FILTER BAR */
  .filter-bar{display:flex;align-items:center;gap:8px;}
  .filter-chip{font-size:12px;padding:4px 10px;border-radius:20px;border:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary);color:var(--color-text-secondary);cursor:pointer;}
  .filter-chip.active{background:var(--color-text-primary);color:var(--color-background-primary);border-color:var(--color-text-primary);}
  .filter-right{margin-left:auto;font-size:12px;color:var(--color-text-tertiary);}

  /* STORY CARDS */
  .story-list{display:flex;flex-direction:column;gap:8px;}
  .story-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:12px 14px;cursor:pointer;transition:border-color 0.15s;}
  .story-card:hover{border-color:var(--color-border-secondary);}
  .story-card.selected{border-color:var(--color-border-info);background:var(--color-background-info);}
  .story-top{display:flex;align-items:flex-start;gap:10px;}
  .story-source{font-size:10px;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:0.06em;white-space:nowrap;}
  .story-title{font-size:13px;font-weight:500;color:var(--color-text-primary);line-height:1.45;flex:1;}
  .story-meta{display:flex;align-items:center;gap:8px;margin-top:6px;}
  .badge{font-size:10px;padding:2px 7px;border-radius:10px;}
  .badge-purple{background:#eeedfe;color:#3c3489;}
  .badge-teal{background:#e1f5ee;color:#0f6e56;}
  .badge-amber{background:#faeeda;color:#854f0b;}
  .badge-blue{background:#e6f1fb;color:#185fa5;}
  .score-bar-wrap{flex:1;height:4px;background:var(--color-background-secondary);border-radius:2px;overflow:hidden;}
  .score-bar{height:100%;border-radius:2px;}
  .platforms{display:flex;gap:4px;margin-left:auto;}
  .plat-dot{width:18px;height:18px;border-radius:50%;background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--color-text-tertiary);}
  .story-actions{display:none;gap:6px;margin-top:8px;padding-top:8px;border-top:0.5px solid var(--color-border-tertiary);}
  .story-card.selected .story-actions{display:flex;}
  .action-btn{font-size:11px;padding:4px 10px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:transparent;color:var(--color-text-secondary);cursor:pointer;}
  .action-btn.primary{background:var(--color-text-primary);color:var(--color-background-primary);border-color:var(--color-text-primary);}
  .priority-badge{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:3px;}
</style>

<script>
const views = {
  dashboard: buildDashboard,
  analytics: buildAnalytics,
  calendar: buildCalendar,
  research: buildResearch,
  media: buildMedia,
  podcast: buildPodcast,
  settings: buildSettings,
};

function setView(name) {
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  event.currentTarget.classList.add('active');
  const main = document.getElementById('main-content');
  main.innerHTML = '';
  (views[name] || buildDashboard)(main);
}

function buildDashboard(main) {
  main.innerHTML = `
    <div class="topbar">
      <span class="topbar-title">Dashboard</span>
      <span class="topbar-sub">Today · Apr 5, 2026</span>
      <div class="topbar-right">
        <button class="btn" onclick="togglePipeline(this)">Run pipeline</button>
        <button class="btn btn-primary">Generate content</button>
      </div>
    </div>
    <div class="content">

      <div class="pipeline-bar" id="pipeline-bar">
        <div class="pipeline-dot success" id="p-dot"></div>
        <div class="pipeline-text" id="p-text"><strong>Pipeline ready</strong> · Last run 14 min ago · 94 articles fetched</div>
        <div class="pipeline-stage" id="p-stage">✓ All providers healthy</div>
      </div>

      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-label">Articles today</div>
          <div class="stat-value">94</div>
          <div class="stat-delta delta-up">+12 vs yesterday</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Posts generated</div>
          <div class="stat-value">18</div>
          <div class="stat-delta delta-up">5 platforms</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Top story score</div>
          <div class="stat-value">9.2</div>
          <div class="stat-delta delta-up">Viral potential: high</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">AI cost today</div>
          <div class="stat-value">₹0</div>
          <div class="stat-delta" style="color:var(--color-text-tertiary)">Free tier · 94% left</div>
        </div>
      </div>

      <div>
        <div class="section-header">AI daily brief</div>
        <div class="intel-card">
          <div class="intel-title">Top 3 stories to post today</div>
          <div class="intel-body">Gemini 2.5 Pro launch (high engagement predicted · AI audience), LLaMA 4 multimodal benchmarks (technical depth · arXiv), OpenAI memory rollout (broad appeal · mainstream). Avoid: crypto, IPO speculation — low resonance this week.</div>
        </div>
      </div>

      <div>
        <div class="filter-bar">
          <div class="filter-chip active">All <span style="opacity:.5;margin-left:3px;">94</span></div>
          <div class="filter-chip">arXiv <span style="opacity:.5;margin-left:3px;">38</span></div>
          <div class="filter-chip">GitHub <span style="opacity:.5;margin-left:3px;">21</span></div>
          <div class="filter-chip">Reddit <span style="opacity:.5;margin-left:3px;">18</span></div>
          <div class="filter-chip">RSS <span style="opacity:.5;margin-left:3px;">17</span></div>
          <div class="filter-right">Sort: Score ↓</div>
        </div>
      </div>

      <div class="story-list">
        ${storyCard('Gemini 2.5 Pro sets new MMLU record, beats GPT-4o on coding benchmarks', 'arXiv', '9.2', ['AI','LLM'], '#7f77dd', true)}
        ${storyCard('LLaMA 4 multimodal: image + video understanding in a single open model', 'arXiv', '8.7', ['Open source','Multimodal'], '#1d9e75', false)}
        ${storyCard('OpenAI rolls out persistent memory to all ChatGPT free users', 'RSS', '8.1', ['Product','OpenAI'], '#d97706', false)}
        ${storyCard('New React compiler RFC: automatic memoization without React.memo', 'GitHub', '7.4', ['Frontend','React'], '#378add', false)}
      </div>

    </div>
  `;
}

function storyCard(title, source, score, tags, color, selected) {
  const pct = Math.round(parseFloat(score) * 10);
  const platLabels = ['Tw','Li','Bl'];
  const platHtml = platLabels.map(p => `<div class="plat-dot">${p}</div>`).join('');
  const tagHtml = tags.map(t => `<span class="badge" style="background:${color}22;color:${color};font-size:10px;padding:2px 7px;border-radius:10px;">${t}</span>`).join('');
  return `
    <div class="story-card${selected?' selected':''}" onclick="this.classList.toggle('selected')">
      <div class="story-top">
        <div class="priority-badge" style="background:${color};margin-top:4px;"></div>
        <div style="flex:1">
          <div class="story-source">${source}</div>
          <div class="story-title">${title}</div>
        </div>
        <div style="text-align:right;flex-shrink:0;margin-left:8px;">
          <div style="font-size:16px;font-weight:500;color:var(--color-text-primary);">${score}</div>
          <div style="font-size:10px;color:var(--color-text-tertiary);">score</div>
        </div>
      </div>
      <div class="story-meta">
        ${tagHtml}
        <div class="score-bar-wrap"><div class="score-bar" style="width:${pct}%;background:${color};"></div></div>
        <div class="platforms">${platHtml}</div>
      </div>
      <div class="story-actions">
        <button class="action-btn primary">Generate posts</button>
        <button class="action-btn">Tag</button>
        <button class="action-btn">Schedule</button>
        <button class="action-btn">Archive</button>
      </div>
    </div>
  `;
}

let pipelineRunning = false;
function togglePipeline(btn) {
  const dot = document.getElementById('p-dot');
  const text = document.getElementById('p-text');
  const stage = document.getElementById('p-stage');
  if (!dot) return;
  if (!pipelineRunning) {
    pipelineRunning = true;
    btn.textContent = 'Running…';
    btn.classList.add('running');
    dot.className = 'pipeline-dot running';
    const stages = [
      ['Fetching arXiv…', '23 papers found'],
      ['Fetching RSS feeds…', '41 articles'],
      ['Fetching GitHub trending…', '18 repos'],
      ['Analysing articles…', 'Cerebras 8B · 12/94'],
      ['Analysing articles…', 'Cerebras 8B · 47/94'],
      ['Analysing articles…', 'Cerebras 8B · 94/94'],
      ['Selecting top stories…', 'Groq 70B deciding'],
      ['Generating content…', 'Groq 70B · Twitter × 3'],
    ];
    let i = 0;
    const interval = setInterval(() => {
      if (i < stages.length) {
        text.innerHTML = `<strong>${stages[i][0]}</strong> · ${stages[i][1]}`;
        stage.textContent = `Step ${i+1} / ${stages.length}`;
        i++;
      } else {
        clearInterval(interval);
        pipelineRunning = false;
        btn.textContent = 'Run pipeline';
        btn.classList.remove('running');
        dot.className = 'pipeline-dot success';
        text.innerHTML = `<strong>Pipeline complete</strong> · 94 articles · 18 posts generated`;
        stage.textContent = '✓ Done just now';
      }
    }, 700);
  }
}

function buildCalendar(main) {
  main.innerHTML = `
    <div class="topbar">
      <span class="topbar-title">Content calendar</span>
      <span class="topbar-sub">April 2026</span>
      <div class="topbar-right"><button class="btn btn-primary">Schedule post</button></div>
    </div>
    <div class="content">
      <div style="background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:16px;">
        <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center;margin-bottom:8px;">
          ${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div style="font-size:10px;color:var(--color-text-tertiary);padding:4px;">${d}</div>`).join('')}
